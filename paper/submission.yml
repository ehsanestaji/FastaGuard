# FastaGuard Bioinformatics Application Note — submission control manifest
# Validated by: python3 paper/check_submission.py

target_journal: Bioinformatics
publisher: Oxford University Press
article_type: Application Note
submission_portal: ScholarOne (Bioinformatics)
format_policy: format-free_first_submission_ok
oup_template_deferred_to: revision

# Machine-check status after `make check` (human ScholarOne/bioRxiv steps remain USER-ACTION).
submission_status: ready_for_author_upload
author_gate_status: confirmed  # 2026-10-24, reported in chat by Ehsan Estaji (Jian-Feng Mao knew of the work and agreed); no message from Jian-Feng seen by the agent
zenodo_gate_status: deposited
biorxiv_status: not_submitted
scholarone_status: not_submitted
# OUP policy: AI use must be disclosed in the cover letter AND the manuscript; preprints must be
# disclosed in the cover letter; update the preprint with the published DOI after acceptance.
ai_disclosure_locations: [manuscript, cover_letter]
preprint_disclosure_location: cover_letter

manuscript:
  source: paper/main.tex
  bibliography: paper/references.bib
  pdf: paper/main.pdf
  biorxiv_pdf: paper/build/fastaguard-biorxiv.pdf
  title: "FastaGuard: FASTA preflight QC for modern bioinformatics pipelines"
  cover_letter: paper/cover-letter.md
  validator_comparison: paper/comparison/
  evidence_rerun_v1_0_0: docs/evidence/results/v1.0.0-rerun/

authors:
  - name: Ehsan Estaji
    affiliation: Umeå Plant Science Centre, Department of Plant Physiology, Umeå University
    email: ehsan.estaji@umu.se
    orcid: 0009-0005-0838-228X
    corresponding: true
  - name: Jian-Feng Mao
    affiliation: Umeå Plant Science Centre, Department of Plant Physiology, Umeå University
    email: jianfeng.mao@umu.se
    orcid: 0000-0001-9735-8516
    corresponding: true

