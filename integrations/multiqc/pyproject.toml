[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiqc-fastaguard"
version = "0.1.0"
description = "MultiQC module for FastaGuard FASTA preflight reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "multiqc>=1.28",
]

[project.urls]
Homepage = "https://github.com/ehsanestaji/FastaGuard"
Repository = "https://github.com/ehsanestaji/FastaGuard"
Issues = "https://github.com/ehsanestaji/FastaGuard/issues"

[project.entry-points."multiqc.modules.v1"]
fastaguard = "fastaguard_multiqc:MultiqcModule"

[project.entry-points."multiqc.hooks.v1"]
before_config = "fastaguard_multiqc.parser:register_search_patterns"

[tool.hatch.build.targets.wheel]
packages = ["src/fastaguard_multiqc"]

[tool.hatch.build.targets.wheel.shared-data]
"README.md" = "share/doc/multiqc-fastaguard/README.md"
