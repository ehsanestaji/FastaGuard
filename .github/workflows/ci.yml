name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  multiqc-plugin:
    name: MultiQC plugin (Python ${{ matrix.python }}, MultiQC ${{ matrix.multiqc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        multiqc: ["1.28", "1.35"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Test built MultiQC plugin
        env:
          FASTAGUARD_MULTIQC_VERSION: ${{ matrix.multiqc }}
        run: python3 -m pytest -q tests/python/test_multiqc_plugin.py

  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Run Python tests
        run: python3 -m pytest -q tests/python

      - name: Build Docker image
        run: docker build -t fastaguard:ci .

      - name: Check committed trailing whitespace
        run: |
          if git grep -nI -E '[[:blank:]]$'; then
            echo "Trailing whitespace found."
            exit 1
          fi
