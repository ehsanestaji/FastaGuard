name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify release tag
        run: scripts/check_release_tag.sh "${GITHUB_REF_NAME}"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test binary
        run: "./target/${{ matrix.target }}/release/fastaguard --schema > /dev/null"

      - name: Package artifact
        run: scripts/package_release_artifact.sh "${{ matrix.target }}" "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fastaguard-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Collect release checksums
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: fastaguard-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Create checksum manifest
        run: |
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fastaguard-${{ github.ref_name }}-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
